<!DOCTYPE html>
<html lang='en'>
  <head>
    <link rel='stylesheet' href='css-folder/contact.css'>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Personal Portfolio Website</title>
  </head>
  <body>
    <!-- 🗺️ Navigation Bar -->
    <nav>
      <ul class='nav-container' type='none'>
        <li class='direction'><a href='index.html'>Home</a></li>
        <li class='direction 2'><a href='contact.html'>Contact</a></li>
        <li class='direction 3'><a href='about.html'>About</a></li>        
      </ul>
    </nav>
        
    <!-- 📦 Main Split Container -->
    <div class='form'>
      
      <!-- Left Column: Intro and Tech Stack -->
      <div class='intro-container'>
        <header>I'm Sean, and I'm mastering web development.</header>
        <h1>Contact</h1>
        <p class='email-text'>watermelonDespiser@sorrowmail.com</p>
        
        <div class='skills-section'>
          <h3>Core Tech Stack</h3>
          <div class='image-container'>
            <!-- Swapped out old images for high-quality transparent vector images -->
            <img class='html-logo' alt='html-logo' src='https://cloudflare.com'>  
            <img alt='javascript-logo' src='https://cloudflare.com'>
            <img alt='css-logo' src='https://cloudflare.com'>
          </div>
        </div>
      </div>

      <!-- Right Column: Clean Form Layout -->
      <div class='contact-info'>
        <form id='myForm' method='POST'>
          
          <div class='form-group'>
            <label for='username'>First Name <span class='required'>(required)</span></label>
            <input type='text' id='username' required>
          </div>

          <div class='form-group'>
            <label for='about-section'>About You <span class='optional'>(optional)</span></label>
            <textarea id='about-section' rows='3'></textarea>
          </div>

          <div class='form-group'>
            <label for='email'>Email <span class='required'>(required)</span></label>
            <input id='email' type='email' required>
          </div>
          
          <div class='form-group'>
            <label for='message'>Message <span class='required'>(required)</span></label>
            <textarea id='message' rows='5' required></textarea>
          </div>

          <button type='submit'>Submit Message</button>
        </form>
        <p id='successMessage'></p>
      </div>

    </div>

    <script src='../javascript-folder/contact.js'></script>
  </body>
</html>
